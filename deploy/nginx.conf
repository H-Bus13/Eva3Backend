# Plantilla inicial HTTP. Sustituir el host; añadir TLS antes de usar
# credenciales reales y activar DJANGO_HTTPS=true al disponer de HTTPS.
server {
    listen 80;
    server_name REEMPLAZAR_CON_IP_O_DOMINIO;
    client_max_body_size 2m;

    location /static/ {
        alias /srv/buildcorp/staticfiles/;
    }

    # Las firmas solo se entregan desde las vistas autenticadas.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://unix:/run/buildcorp/app.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
